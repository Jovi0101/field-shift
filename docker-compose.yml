services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-field_shift}
      POSTGRES_USER: ${POSTGRES_USER:-field_shift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-field_shift_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-field_shift} -d ${POSTGRES_DB:-field_shift}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
